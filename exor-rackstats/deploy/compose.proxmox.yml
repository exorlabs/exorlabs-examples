services:
  proxmox-stats:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env.proxmox
    user: "${RACKSTATS_UID:-1000}:${RACKSTATS_GID:-1000}"
    ports:
      - "${RACKSTATS_PORT:-4310}:${RACKSTATS_PORT:-4310}"
    environment:
      RACKSTATS_TLS_CERT: /secrets/proxmox.crt
      RACKSTATS_TLS_KEY: /secrets/proxmox.key
      PVE_CA_FILE: /secrets/pve-root-ca.pem
    volumes:
      - ../secrets:/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
